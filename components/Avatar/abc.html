<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Moving Love Animation</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#ffd89b, #19547b);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 80px;
    background: #2e2e2e;
  }

  .scene {
    position: absolute;
    bottom: 80px;
    left: -200px;
    display: flex;
    align-items: flex-end;
    animation: walkScene 60s linear forwards;
  }

  @keyframes walkScene {
    0% { left: -200px; }
    100% { left: 100%; }
  }

  .character {
    position: relative;
    width: 60px;
    height: 140px;
    margin-right: 20px;
  }

  .body {
    position: absolute;
    bottom: 0;
    width: 60px;
    height: 90px;
    border-radius: 30px 30px 10px 10px;
  }

  .boy .body { background: #4a90e2; }
  .girl .body { background: #e26aa0; }

  .head {
    position: absolute;
    top: -45px;
    left: 5px;
    width: 50px;
    height: 50px;
    background: #ffddb8;
    border-radius: 50%;
  }

  .leg {
    position: absolute;
    bottom: -30px;
    width: 12px;
    height: 30px;
    background: #000;
    animation: walkLegs 1s infinite alternate;
  }

  .leg.left { left: 15px; }
  .leg.right { right: 15px; animation-delay: .5s; }

  @keyframes walkLegs {
    from { transform: rotate(20deg); }
    to { transform: rotate(-20deg); }
  }

  .boy {
    transform: translateX(-20px);
  }

  .jacket {
    position: absolute;
    top: 50px;
    left: 80px;
    width: 70px;
    height: 50px;
    background: #4a90e2;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .caption {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    color: white;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .show {
    opacity: 1;
  }
</style>
</head>

<body>

<div class="caption" id="caption"></div>

<div class="scene" id="scene">

  <div class="character boy">
    <div class="head"></div>
    <div class="body"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>

  <div class="character girl">
    <div class="head"></div>
    <div class="body"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>

  <div class="jacket" id="jacket"></div>
</div>

<div class="ground"></div>

<script>
  const caption = document.getElementById("caption");
  const jacket = document.getElementById("jacket");

  function showText(text, delay) {
    setTimeout(() => {
      caption.textContent = text;
      caption.classList.add("show");
    }, delay);

    setTimeout(() => {
      caption.classList.remove("show");
    }, delay + 4000);
  }

  showText("They walk together...", 1000);
  showText("He stays on the road side to protect her", 8000);

  setTimeout(() => {
    jacket.style.opacity = 1;
  }, 15000);

  showText("He gives her his jacket", 16000);
  showText("Love is care, not control ❤️", 26000);
</script>

</body>
</html>
